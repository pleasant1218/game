@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1a2e;
  --panel-bg: #16213e;
  --panel-border: #0f3460;
  --accent: #e94560;
  --accent2: #f5a623;
  --text: #e0e0e0;
  --text-dim: #888;
  --gold: #FFD700;
  --green: #4CAF50;
  --radius: 10px;
  --pixel-font: 'Press Start 2P', monospace;
  --ui-font: 'VT323', monospace;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui-font);
  font-size: 18px;
  overflow: hidden;
}

/* ─── LAYOUT ─────────────────────────────────────────────────── */

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 1400px;
  margin: 0 auto;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  background: var(--panel-bg);
  border-bottom: 3px solid var(--panel-border);
  flex-shrink: 0;
  image-rendering: pixelated;
}

.logo {
  font-family: var(--pixel-font);
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 1px;
  text-shadow: 2px 2px #000;
}

.logo span { color: var(--accent); }

.player-tabs {
  display: flex;
  gap: 8px;
}

.player-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(255,255,255,0.05);
  border: 2px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--pixel-font);
  font-size: 12px;
}

.player-tab:hover { background: rgba(255,255,255,0.1); }

.player-tab.active {
  background: rgba(233, 69, 96, 0.2);
  border-color: var(--accent);
  color: var(--gold);
}

.tab-avatar {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 3px solid;
}

.tab-coins { color: var(--gold); font-size: 13px; }

#main-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  gap: 0;
}

/* ─── GAME CANVAS ────────────────────────────────────────────── */

#game-container {
  flex: 1;
  position: relative;
  background: #000;
  image-rendering: pixelated;
}

#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: crosshair;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

.game-hint {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--pixel-font);
  font-size: 7px;
  color: rgba(255,255,255,0.5);
  pointer-events: none;
  text-align: center;
}

/* ─── SIDE PANEL ─────────────────────────────────────────────── */

#side-panel {
  width: 440px;
  flex-shrink: 0;
  background: var(--panel-bg);
  border-left: 3px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-nav {
  display: flex;
  border-bottom: 3px solid var(--panel-border);
  flex-shrink: 0;
}

.panel-tab {
  flex: 1;
  padding: 12px 4px;
  text-align: center;
  cursor: pointer;
  font-family: var(--pixel-font);
  font-size: 11px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  transition: all 0.15s;
  border-bottom: 3px solid transparent;
}

.panel-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.panel-tab.active { color: var(--gold); border-bottom-color: var(--gold); background: rgba(255,215,0,0.07); }

#panel-content {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--panel-border) transparent;
}

#panel-content::-webkit-scrollbar { width: 6px; }
#panel-content::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }

/* ─── PANEL SECTIONS ─────────────────────────────────────────── */

.panel-section { margin-bottom: 20px; }

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  font-family: var(--pixel-font);
  font-size: 12px;
  color: var(--gold);
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(255,215,0,0.2);
}

.section-sub {
  font-size: 21px;
  color: var(--text-dim);
  margin: 10px 0 6px;
}

.empty-state {
  text-align: center;
  color: var(--text-dim);
  font-size: 22px;
  padding: 20px 0;
  line-height: 1.8;
}

.coins-hint, .rewards-hint {
  font-size: 21px;
  color: var(--text-dim);
  margin-bottom: 10px;
  background: rgba(255,215,0,0.05);
  padding: 6px 10px;
  border-radius: 6px;
  border-left: 3px solid var(--gold);
}

/* ─── GOAL CARDS ─────────────────────────────────────────────── */

.goal-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}

.goal-card:hover { border-color: rgba(255,215,0,0.3); }
.goal-card.completed { border-color: var(--green); opacity: 0.85; }
.goal-card.other { border-color: rgba(100,149,237,0.3); }

.goal-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.goal-title {
  flex: 1;
  font-family: var(--pixel-font);
  font-size: 11px;
  color: #fff;
  word-break: break-word;
  line-height: 1.4;
}

.badge-done {
  background: var(--green);
  color: #fff;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 16px;
}

.goal-progress-row {
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.goal-pct { color: var(--gold); font-family: var(--pixel-font); font-size: 12px; }

.progress-bar {
  height: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 8px;
}

.progress-bar.mini { height: 6px; margin: 4px 0 2px; }

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #4CAF50, #8BC34A);
  border-radius: 5px;
  transition: width 0.5s ease;
}

.progress-fill.full { background: linear-gradient(90deg, var(--gold), #FFA500); }

.milestone-row {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
}

.milestone {
  flex: 1;
  text-align: center;
  font-size: 16px;
  padding: 4px 0;
  background: rgba(255,255,255,0.06);
  border-radius: 4px;
  color: var(--text-dim);
}

.milestone.earned {
  background: rgba(255,215,0,0.2);
  color: var(--gold);
}

.goal-update-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

/* ─── TODO ITEMS ─────────────────────────────────────────────── */

.todo-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  margin-bottom: 6px;
}

.todo-item.done { opacity: 0.5; }

.todo-check {
  background: none;
  border: 2px solid var(--accent);
  color: var(--accent);
  width: 22px; height: 22px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.todo-check:hover { background: var(--accent); color: #fff; }

.done-check {
  color: var(--green);
  font-size: 16px;
  width: 22px;
  text-align: center;
  flex-shrink: 0;
}

.todo-text { flex: 1; font-size: 22px; }
.todo-text.private { color: var(--text-dim); }
.done-text { text-decoration: line-through; color: var(--text-dim); }

/* ─── SHOP ───────────────────────────────────────────────────── */

.coins-display {
  font-family: var(--pixel-font);
  font-size: 12px;
  color: var(--gold);
}

.shop-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 4px;
}

.shop-item {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 8px 4px;
  text-align: center;
  transition: all 0.15s;
}

.shop-item:hover { border-color: rgba(255,215,0,0.3); transform: translateY(-2px); }
.shop-item.wearing { border-color: var(--gold); background: rgba(255,215,0,0.1); }
.shop-item.owned { border-color: var(--green); opacity: 0.8; }

.shop-preview {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
  font-size: 22px;
}

.furniture-prev {
  background: rgba(255,255,255,0.08);
  font-size: 28px;
}

.outfit-icon { font-size: 28px; }
.shop-name { font-size: 16px; color: var(--text-dim); margin-bottom: 4px; line-height: 1.3; }
.shop-status { font-size: 16px; color: var(--green); }

/* ─── REWARDS ────────────────────────────────────────────────── */

.reward-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  margin-bottom: 10px;
}

.reward-card.redeemed { border-color: var(--gold); background: rgba(255,215,0,0.07); }

.reward-emoji { font-size: 38px; flex-shrink: 0; }
.reward-info { flex: 1; min-width: 0; }
.reward-name { font-family: var(--pixel-font); font-size: 11px; color: #fff; margin-bottom: 6px; line-height: 1.4; word-break: break-word; }
.reward-price { color: var(--gold); font-size: 20px; margin-bottom: 4px; }
.reward-progress-text { font-size: 18px; color: var(--text-dim); }
.redeemed-label { color: var(--gold); font-size: 20px; }

.btn-redeem {
  padding: 8px 12px;
  background: linear-gradient(135deg, var(--accent), #c0392b);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  font-family: var(--pixel-font);
  font-size: 11px;
  line-height: 1.5;
  flex-shrink: 0;
  text-align: center;
  transition: opacity 0.15s;
}

.btn-redeem.disabled {
  background: rgba(255,255,255,0.1);
  color: var(--text-dim);
  cursor: not-allowed;
}

/* ─── STATUS ─────────────────────────────────────────────────── */

.status-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.status-item {
  padding: 14px 10px;
  background: rgba(255,255,255,0.04);
  border: 2px solid rgba(255,255,255,0.08);
  border-radius: var(--radius);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}

.status-item:hover { border-color: rgba(255,215,0,0.3); background: rgba(255,255,255,0.07); }
.status-item.active { border-color: var(--gold); background: rgba(255,215,0,0.1); }

.status-emoji { font-size: 36px; margin-bottom: 8px; }
.status-label { font-size: 20px; color: var(--text-dim); }

.status-check {
  position: absolute;
  top: 6px; right: 8px;
  color: var(--gold);
  font-size: 18px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.stat-item {
  background: rgba(255,255,255,0.04);
  border-radius: 8px;
  padding: 10px 6px;
  text-align: center;
}

.stat-val { font-family: var(--pixel-font); font-size: 12px; color: var(--gold); margin-bottom: 8px; }
.stat-label { font-size: 18px; color: var(--text-dim); }

.cheatsheet {
  background: rgba(0,0,0,0.3);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 20px;
  color: var(--text-dim);
  line-height: 1.8;
}

/* ─── FORMS ──────────────────────────────────────────────────── */

.add-form {
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,215,0,0.2);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}

.input-full, .input-half, .input-small {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--ui-font);
  font-size: 22px;
  padding: 8px 10px;
  outline: none;
  transition: border-color 0.15s;
}

.input-full { width: 100%; margin-bottom: 8px; }
.input-half { width: calc(33% - 4px); margin-bottom: 8px; }
.input-small { width: 100px; }

.input-full:focus, .input-half:focus, .input-small:focus {
  border-color: var(--gold);
}

.input-row { display: flex; gap: 6px; flex-wrap: wrap; }

.checkbox-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  color: var(--text-dim);
  cursor: pointer;
  margin-bottom: 10px;
}

.form-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* ─── BUTTONS ────────────────────────────────────────────────── */

.btn-add {
  background: rgba(255,215,0,0.15);
  border: 1px solid rgba(255,215,0,0.4);
  color: var(--gold);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--pixel-font);
  font-size: 11px;
  transition: all 0.15s;
}

.btn-add:hover { background: rgba(255,215,0,0.25); }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #c0392b);
  border: none;
  color: #fff;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-family: var(--pixel-font);
  font-size: 12px;
  transition: opacity 0.15s;
}

.btn-primary:hover { opacity: 0.85; }

.btn-cancel {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--text-dim);
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-family: var(--pixel-font);
  font-size: 12px;
}

.btn-cancel:hover { background: rgba(255,255,255,0.12); }

.btn-sm {
  padding: 6px 10px;
  background: rgba(255,215,0,0.15);
  border: 1px solid rgba(255,215,0,0.4);
  color: var(--gold);
  border-radius: 6px;
  cursor: pointer;
  font-size: 18px;
  font-family: var(--ui-font);
  transition: all 0.15s;
  white-space: nowrap;
}

.btn-sm:hover { background: rgba(255,215,0,0.25); }
.btn-sm.disabled { opacity: 0.4; cursor: not-allowed; }

.btn-icon {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 20px;
  padding: 2px 6px;
  border-radius: 4px;
  flex-shrink: 0;
  transition: all 0.15s;
}

.btn-icon:hover { background: rgba(233,69,96,0.2); color: var(--accent); }

/* ─── NOTIFICATION ───────────────────────────────────────────── */

#notification {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(0,0,0,0.85);
  border: 2px solid var(--gold);
  color: var(--gold);
  font-family: var(--pixel-font);
  font-size: 9px;
  padding: 12px 20px;
  border-radius: 10px;
  z-index: 1000;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  white-space: nowrap;
  box-shadow: 0 4px 20px rgba(255,215,0,0.3);
}

#notification.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

#notification.info { border-color: #87CEEB; color: #87CEEB; }
#notification.warn { border-color: var(--accent); color: var(--accent); }
#notification.celebrate { border-color: #FF69B4; color: #FF69B4; box-shadow: 0 4px 20px rgba(255,105,180,0.4); }

/* ─── CONFETTI ───────────────────────────────────────────────── */

#confetti-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 999;
  display: none;
}

/* ─── COIN DISPLAY ───────────────────────────────────────────── */

#coin-display {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(0,0,0,0.65);
  border: 2px solid var(--gold);
  border-radius: 8px;
  padding: 8px 14px;
  font-family: var(--pixel-font);
  font-size: 13px;
  color: var(--gold);
  pointer-events: none;
  z-index: 10;
}

/* ─── LOGIN OVERLAY ──────────────────────────────────────────── */

#login-overlay {
  position: fixed; inset: 0;
  background: rgba(10,10,20,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9000;
  backdrop-filter: blur(6px);
}

.login-box {
  background: var(--panel-bg);

.login-title {

.login-eyes {

.login-name {

.login-coins { font-size: 15px; color: var(--gold); }

}

/* ─── LOGOUT BUTTON ──────────────────────────────────────────── */

/* readonly tab */

.player-tab.readonly:hover { background: rgba(255,255,255,0.05); }

/* PIN form */

/* shake animation for wrong PIN */
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%,60%  { transform: translateX(-8px); }
  40%,80%  { transform: translateX(8px); }
}
.shake { animation: shake 0.4s ease; }

/* ─── RESPONSIVE ─────────────────────────────────────────────── */

@media (max-width: 900px) {

  .shop-grid { grid-template-columns: repeat(4, 1fr); }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// Data layer — Supabase cloud storage + localStorage fallback

const SUPABASE_URL = 'https://inbkpznkkdntyaggqbcr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImluYmtwem5ra2RudHlhZ2dxYmNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5ODE4NDUsImV4cCI6MjA5MjU1Nzg0NX0.XaCOG_Bp6Aa8IcjeBMnVYxhcCBK4oH0AfqL3-rVQjCc';

// Supabase client — uses authenticated JWT for all API calls
const _db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DEFAULT_PLAYERS = {
  bjerg: {
    id: 'bjerg', displayName: 'bjerg',
    skin: '#FFDAB9', hairColor: '#8B5E3C', hairStyle: 'short', eyeColor: '#4A90D9',
    coins: 0, outfit: 'default', ownedOutfits: ['default'], furniture: [],

    skin: '#F0C89A', hairColor: '#1C1C1C', hairStyle: 'long', eyeColor: '#6B3D2A',
    coins: 0, outfit: 'default', ownedOutfits: ['default'], furniture: [],
    status: 'home', pose: 'stand', snapTarget: null, pin: null,
    homeLayout: {}, homeLayoutSavedAt: {},
    goals: [], todos: [], customRewards: [], achievements: [],
    createdAt: Date.now()
  }
};

const DEFAULT_HOME_LAYOUT = { desk: 0.14, sofa: 0.36, bed: 0.58 };

const SHOP_ITEMS = {
  outfits: [
    { id: 'default',    name: 'Default',       price: 0,    color: null      },
    { id: 'red',        name: 'Red Dress',     price: 150,  color: '#E74C3C' },
    { id: 'blue',       name: 'Blue Suit',     price: 150,  color: '#2980B9' },
    { id: 'green',      name: 'Green Hoodie',  price: 120,  color: '#27AE60' },
    { id: 'purple',     name: 'Purple Robe',   price: 200,  color: '#8E44AD' },
    { id: 'yellow',     name: 'Yellow Jacket', price: 180,  color: '#F1C40F' },
    { id: 'pink',       name: 'Pink Sweater',  price: 160,  color: '#E91E8C' },
    { id: 'black',      name: 'Black Outfit',  price: 220,  color: '#2C3E50' },
  ],
  furniture: [
    { id: 'plant',     name: 'Cute Plant',   price: 80,  emoji: '🌱' },
    { id: 'lamp',      name: 'Cozy Lamp',    price: 100, emoji: '🪔' },
    { id: 'bookshelf', name: 'Bookshelf',    price: 150, emoji: '📚' },
    { id: 'cat',       name: 'Pet Cat',      price: 300, emoji: '🐱' },
    { id: 'flowers',   name: 'Flower Vase',  price: 90,  emoji: '🌸' },
    { id: 'music',     name: 'Music Box',    price: 200, emoji: '🎵' },
  ]
};

const COIN_REWARDS = {
  todoComplete: 10,
  goalMilestone25: 50, goalMilestone50: 100, goalMilestone75: 150,
  goalComplete: 500, streak7: 100, streak30: 500,
};

const Data = {
  _cache: null,
  _saveTimers: {},

  // ─── Remote (Supabase) ───────────────────────────────────────────────────────

  async loadRemote() {
    // Always reset so index.html can check it after this call
    this._cloudHadRow = { bjerg: false, hungry: false };

    // ── Step 1: restore Supabase auth session ──────────────────────────────
    const hasSession = await Auth.initialize();

    if (!hasSession) {
      window._supabaseOK = false;
      const raw = localStorage.getItem('coupleGame');
      this._cache = raw
        ? JSON.parse(raw)
        : { players: JSON.parse(JSON.stringify(DEFAULT_PLAYERS)), sharedMemories: [], version: 1 };
      return this._cache;
    }

    // ── Step 2: read from Supabase using authenticated client ──────────────
    let cloud = null;
    try {
      const { data, error } = await _db.from('game_state').select('id, data');
      if (error) throw error;
      cloud = {};
      data.forEach(r => { cloud[r.id] = r.data; });
      this._cloudHadRow = { bjerg: !!cloud['bjerg'], hungry: !!cloud['hungry'] };
      window._supabaseOK = true;
    } catch (e) {
      console.warn('[Supabase] read failed:', e.message);
      window._supabaseError = 'read: ' + e.message;
      const raw = localStorage.getItem('coupleGame');
      this._cache = raw
        ? JSON.parse(raw)
        : { players: JSON.parse(JSON.stringify(DEFAULT_PLAYERS)), sharedMemories: [], version: 1 };
      window._supabaseOK = false;
      return this._cache;
    }

    // ── Step 3: merge cloud + localStorage ─────────────────────────────────
    const lsRaw = localStorage.getItem('coupleGame');
    const local = lsRaw ? JSON.parse(lsRaw) : null;
    const def   = JSON.parse(JSON.stringify(DEFAULT_PLAYERS));

    // Cloud wins when it has a row; fall back to local when cloud is empty.
    // If both exist, the one with the newer _savedAt timestamp wins.
    const merge = (id) => {
      const c = cloud[id] || null;
      const l = local?.players?.[id] || null;
      if (!c && !l) return { ...def[id] };
      if (!c)       return { ...def[id], ...l };
      if (!l)       return { ...def[id], ...c };
      const cloudTime = c._savedAt || 0;
      const localTime = l._savedAt || 0;
      return cloudTime >= localTime ? { ...def[id], ...c } : { ...def[id], ...l };
    };

    this._cache = {
      players: { bjerg: merge('bjerg'), hungry: merge('hungry') },
      sharedMemories: [],
      version: 1,
    };
    localStorage.setItem('coupleGame', JSON.stringify(this._cache));

    // ── Step 4: only push rows that don't exist in cloud yet ───────────────
    // NEVER overwrite an existing cloud row here — trust Supabase as the
    // source of truth.  Individual updatePlayer() calls handle incremental saves.
    try {
      for (const id of ['bjerg', 'hungry']) {
        if (!cloud[id]) {
          // Only push if local had real user data (not just app defaults)
          const lp = local?.players?.[id];
          const hasRealData = lp && (
            lp.goals?.length || lp.todos?.length || lp.coins ||
            lp.customRewards?.length || lp.furniture?.length
          );
          if (hasRealData) {
            await this._upsertPlayer(id, this._cache.players[id]);
          }
        }
      }
    } catch (e) {
      console.warn('[Supabase] init write failed:', e.message);
      window._supabaseError = 'write: ' + e.message;
      window._supabaseOK = false;
    }

    return this._cache;
  },

  async _upsertPlayer(id, playerData) {
    const { error } = await _db.from('game_state').upsert(
      { id, data: playerData, updated_at: new Date().toISOString() },
      { onConflict: 'id' }
    );
    if (error) throw new Error(`upsert ${id}: ${error.message}`);
  },

  _savePlayerRemote(id) {
    clearTimeout(this._saveTimers[id]);
    this._saveTimers[id] = setTimeout(async () => {
      const p = this._cache?.players?.[id];
      if (!p) return;
      try {
        await this._upsertPlayer(id, p);
        window._supabaseOK = true;
        if (typeof updateSyncStatus === 'function') updateSyncStatus();
      } catch (e) {
        console.warn('[Supabase] save failed:', e.message);
        window._supabaseError = 'save: ' + e.message;
        window._supabaseOK = false;
        if (typeof updateSyncStatus === 'function') updateSyncStatus();
      }
    }, 500);
  },

  // Subscribe to real-time changes — idempotent, safe to call multiple times
  setupRealtime() {
    if (this._realtimeSubscribed) return;
    this._realtimeSubscribed = true;
    try {
      _db.channel('game')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'game_state' }, payload => {
          const changedId = payload.new?.id;
          const loggedIn  = Auth.getLoggedIn();
          // Only apply the OTHER player's updates — don't clobber local changes
          if (changedId && changedId !== loggedIn &&
              payload.new?.data && this._cache?.players?.[changedId]) {
            this._cache.players[changedId] = { ...this._cache.players[changedId], ...payload.new.data };
            localStorage.setItem('coupleGame', JSON.stringify(this._cache));
            if (typeof renderUI === 'function') renderUI();
          }
        })
        .subscribe();
    } catch (e) {
      console.warn('[Supabase] realtime subscription failed:', e.message);
      this._realtimeSubscribed = false;
    }
  },

  // ─── Local (synchronous, used by game loop) ───────────────────────────────

  load() {
    if (this._cache) return this._cache;
    const raw = localStorage.getItem('coupleGame');
    this._cache = raw
      ? JSON.parse(raw)
      : { players: JSON.parse(JSON.stringify(DEFAULT_PLAYERS)), sharedMemories: [], version: 1 };
    return this._cache;
  },

  save() {
    localStorage.setItem('coupleGame', JSON.stringify(this._cache));
  },

  getPlayer(id) {
    return this.load().players[id];
  },

  updatePlayer(id, updates) {
    const data = this.load();
    data.players[id] = { ...data.players[id], ...updates, _savedAt: Date.now() };
    this._cache = data;
    this.save();
    this._savePlayerRemote(id); // async cloud save, debounced
    return data.players[id];
  },

  // ─── Goals ───────────────────────────────────────────────────────────────────

  addGoal(playerId, goal) {
    const player = this.getPlayer(playerId);
    const newGoal = {
      id: Date.now().toString(),
      title: goal.title, description: goal.description || '',
      type: goal.type || 'number', target: goal.target,
      current: goal.current || 0, unit: goal.unit || '',
      isPrivate: goal.isPrivate || false,
      milestones: { 25: false, 50: false, 75: false, 100: false },
      createdAt: Date.now(), completedAt: null
    };
    this.updatePlayer(playerId, { goals: [...player.goals, newGoal] });
    return newGoal;
  },

  updateGoalProgress(playerId, goalId, newValue) {
    const player = this.getPlayer(playerId);
    const goals = player.goals.map(g => {
      if (g.id !== goalId) return g;
      const updated = { ...g, current: newValue };
      const pct = Math.min(100, (newValue / g.target) * 100);
      let coinsEarned = 0;
      if (pct >= 25  && !g.milestones[25])  { updated.milestones = { ...g.milestones, 25: true };           coinsEarned += COIN_REWARDS.goalMilestone25; }
      if (pct >= 50  && !g.milestones[50])  { updated.milestones = { ...updated.milestones, 50: true };     coinsEarned += COIN_REWARDS.goalMilestone50; }
      if (pct >= 75  && !g.milestones[75])  { updated.milestones = { ...updated.milestones, 75: true };     coinsEarned += COIN_REWARDS.goalMilestone75; }
      if (pct >= 100 && !g.milestones[100]) {
        updated.milestones = { ...updated.milestones, 100: true };
        updated.completedAt = Date.now();
        coinsEarned += COIN_REWARDS.goalComplete;
      }
      return { goal: updated, coinsEarned };
    });
    let totalCoins = 0;
    const cleanGoals = goals.map(item => {
      if (item.coinsEarned !== undefined) { totalCoins += item.coinsEarned; return item.goal; }
      return item;
    });
    this.updatePlayer(playerId, { goals: cleanGoals, coins: player.coins + totalCoins });
    return totalCoins;
  },

  deleteGoal(playerId, goalId) {
    const player = this.getPlayer(playerId);
    this.updatePlayer(playerId, { goals: player.goals.filter(g => g.id !== goalId) });
  },

  // ─── Todos ───────────────────────────────────────────────────────────────────

  addTodo(playerId, text, isPrivate = false) {
    const player = this.getPlayer(playerId);
    const todo = { id: Date.now().toString(), text, isPrivate, done: false, createdAt: Date.now() };
    this.updatePlayer(playerId, { todos: [...player.todos, todo] });
    return todo;
  },

  completeTodo(playerId, todoId) {
    const player = this.getPlayer(playerId);
    const todos = player.todos.map(t =>
      t.id === todoId ? { ...t, done: true, completedAt: Date.now() } : t
    );
    this.updatePlayer(playerId, { todos, coins: player.coins + COIN_REWARDS.todoComplete });
    return COIN_REWARDS.todoComplete;
  },

  deleteTodo(playerId, todoId) {
    const player = this.getPlayer(playerId);
    this.updatePlayer(playerId, { todos: player.todos.filter(t => t.id !== todoId) });
  },

  // ─── Shop ────────────────────────────────────────────────────────────────────

  addCustomReward(playerId, reward) {
    const player = this.getPlayer(playerId);
    const newReward = {
      id: Date.now().toString(), name: reward.name, price: reward.price,
      isCouple: reward.isCouple || false, emoji: reward.emoji || '🎁',
      redeemed: false, createdBy: playerId
    };
    this.updatePlayer(playerId, { customRewards: [...player.customRewards, newReward] });
    return newReward;
  },

  redeemCustomReward(playerId, rewardId) {
    const player = this.getPlayer(playerId);
    const reward = player.customRewards.find(r => r.id === rewardId);
    if (!reward || player.coins < reward.price) return false;
    const customRewards = player.customRewards.map(r =>
      r.id === rewardId ? { ...r, redeemed: true, redeemedAt: Date.now() } : r
    );
    this.updatePlayer(playerId, { customRewards, coins: player.coins - reward.price });
    const data = this.load();
    data.sharedMemories.push({
      id: Date.now().toString(), type: 'reward', playerId,
      text: `${player.displayName} redeemed "${reward.name}"! 🎉`,
      timestamp: Date.now()
    });
    this._cache = data;
    this.save();
    return true;
  },

  buyOutfit(playerId, outfitId) {
    const player = this.getPlayer(playerId);
    const item = SHOP_ITEMS.outfits.find(i => i.id === outfitId);
    if (!item || player.coins < item.price) return false;
    const owned = player.ownedOutfits || ['default'];
    if (owned.includes(outfitId)) return false;
    this.updatePlayer(playerId, { coins: player.coins - item.price, ownedOutfits: [...owned, outfitId] });
    return true;
  },

  wearOutfit(playerId, outfitId) {
    const player = this.getPlayer(playerId);
    const owned = player.ownedOutfits || ['default'];
    if (!owned.includes(outfitId)) return false;
    this.updatePlayer(playerId, { outfit: outfitId });
    return true;
  },

  buyFurniture(playerId, furnitureId) {
    const player = this.getPlayer(playerId);
    const item = SHOP_ITEMS.furniture.find(i => i.id === furnitureId);
    if (!item || player.coins < item.price) return false;
    if (player.furniture.includes(furnitureId)) return false;
    this.updatePlayer(playerId, { coins: player.coins - item.price, furniture: [...player.furniture, furnitureId] });
    return true;
  },

  setStatus(playerId, status) { this.updatePlayer(playerId, { status }); },
  addCoins(playerId, amount) {
    const player = this.getPlayer(playerId);
    this.updatePlayer(playerId, { coins: player.coins + amount });
  },

  getShopItems()   { return SHOP_ITEMS; },
  getCoinRewards() { return COIN_REWARDS; },

  // ─── Home layout ────────────────────────────────────────────────────────────

  getDefaultHomeLayout() { return { ...DEFAULT_HOME_LAYOUT }; },

  getHomeLayout() {
    const data = this.load();
    const b = data.players.bjerg || {};
    const h = data.players.hungry || {};
    const merged = { ...DEFAULT_HOME_LAYOUT };
    for (const key of Object.keys(DEFAULT_HOME_LAYOUT)) {
      const bx = b.homeLayout?.[key], bt = b.homeLayoutSavedAt?.[key] || 0;
      const hx = h.homeLayout?.[key], ht = h.homeLayoutSavedAt?.[key] || 0;
      if (bx != null && hx != null) merged[key] = bt >= ht ? bx : hx;
      else if (bx != null)          merged[key] = bx;
      else if (hx != null)          merged[key] = hx;
    }
    return merged;
  },

  setFurniturePos(playerId, key, xPct) {
    if (!(key in DEFAULT_HOME_LAYOUT)) return;
    const player = this.getPlayer(playerId);
    const homeLayout        = { ...(player.homeLayout || {}),        [key]: xPct };
    const homeLayoutSavedAt = { ...(player.homeLayoutSavedAt || {}), [key]: Date.now() };
    this.updatePlayer(playerId, { homeLayout, homeLayoutSavedAt });
  },
};

// ─── Auth ─────────────────────────────────────────────────────────────────────

const Auth = {
  _playerId:        null,
  _isAuthenticated: false,

  // Called once during loadRemote() — restores existing session
  async initialize() {
    const { data: { session } } = await _db.auth.getSession();
    if (session) {
      this._isAuthenticated = true;
      this._playerId = session.user.user_metadata?.player_id || null;
    }
    return !!session;
  },

  // Synchronous — safe to call after loadRemote() has resolved
  getLoggedIn() { return this._playerId; },

  async signIn(email, password) {
    const { data, error } = await _db.auth.signInWithPassword({ email, password });
    if (error) throw error;
    this._isAuthenticated = true;
    this._playerId = data.user.user_metadata?.player_id || null;
    return { needsPlayerChoice: !this._playerId };
  },

  // Called once after first login to associate this Supabase account with bjerg/hungry
  async setPlayer(playerId) {
    const { error } = await _db.auth.updateUser({ data: { player_id: playerId } });
    if (error) throw error;
    this._playerId = playerId;
  },

  async signOut() {
    await _db.auth.signOut();
    this._playerId = null;
    this._isAuthenticated = false;
    location.reload();
  },
};

<script>
// Pixel art sprite renderer — Stardew Valley inspired style

// Sprite grid dimensions (in pixel cells, pre-scale)
const SPRITE_W = 14;
const SPRITE_H = 24;

const OUTFIT_COLORS = {
  default: { shirt: '#5B9BD5', pants: '#2C3E50' },
  red:     { shirt: '#E74C3C', pants: '#922B21' },
  blue:    { shirt: '#2980B9', pants: '#1A5276' },
  green:   { shirt: '#27AE60', pants: '#1D6A3A' },
  purple:  { shirt: '#8E44AD', pants: '#5B2C6F' },
  yellow:  { shirt: '#F1C40F', pants: '#9A7D0A' },
  pink:    { shirt: '#E91E8C', pants: '#8C1255' },
  black:   { shirt: '#2C3E50', pants: '#1A252F' },
};

function _dk(hex, amt) {
  if (!hex || hex === 'transparent') return hex;
  const r = Math.max(0, parseInt(hex.slice(1,3),16) - amt);
  const g = Math.max(0, parseInt(hex.slice(3,5),16) - amt);
  const b = Math.max(0, parseInt(hex.slice(5,7),16) - amt);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function _lt(hex, amt) {
  if (!hex || hex === 'transparent') return hex;
  const r = Math.min(255, parseInt(hex.slice(1,3),16) + amt);
  const g = Math.min(255, parseInt(hex.slice(3,5),16) + amt);
  const b = Math.min(255, parseInt(hex.slice(5,7),16) + amt);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function buildSpriteGrid(player) {
  const T   = 'transparent';
  const sk  = player.skin;
  const skH = _lt(sk, 30);          // forehead highlight
  const hr  = player.hairColor;
  const hrH = _lt(hr, 50);          // hair highlight
  const hrD = _dk(hr, 35);          // hair shadow
  const hrX = _lt(hr, 85);          // extra bright wave crest
  const outfit = OUTFIT_COLORS[player.outfit || 'default'];
  const st  = outfit.shirt;
  const stH = _lt(st, 32);          // shirt highlight
  const stD = _dk(st, 42);          // shirt shadow
  const pn  = outfit.pants;
  const pnD = _dk(pn, 42);          // pants shadow
  const blt = _dk(pn, 70);          // belt
  const ey  = player.eyeColor;
  const eyW = '#F2EAEA';            // warm eye white
  const eyP = _dk(ey, 55);          // pupil
  const brow = _dk(hr, 10);         // eyebrow
  const ck  = '#F09878';            // cheek blush
  const mt  = '#9A5038';            // mouth
  const bt  = '#3D2B1F';            // boot
  const btH = '#6B4830';            // boot toe highlight

  if (player.hairStyle === 'long') {
    // hungry — HUGE voluminous wavy long hair, big S-curve waves past shoulders
    // 14 cols × 24 rows.  Face occupies cols 4–9, rows 6–12; hair
    // fills rows 0–5 entirely, frames rows 6–13, and flows past the body
    // on rows 14–19 in alternating wave crests and troughs.
    return [
      // ── HAIR CROWN (rows 0-5) — 6 dense rows of big hair ─────────────────
      [T,   T,   hrH, hr,  hrX, hr,  hr,  hr,  hr,  hrX, hr,  hrH, T,   T  ], // 0  top peak
      [T,   hrH, hr,  hrX, hr,  hrH, hr,  hr,  hrH, hr,  hrX, hr,  hrH, T  ], // 1  spreading
      [hrH, hr,  hrX, hr,  hrH, hr,  hrH, hr,  hr,  hrH, hr,  hrX, hr,  hrH], // 2  wider, wave texture
      [hr,  hrX, hr,  hrH, hr,  hrX, hr,  hr,  hrX, hr,  hrH, hr,  hrX, hr ], // 3  MAX volume (14 wide)
      [hr,  hr,  hrH, hr,  hrH, hr,  hrH, hrH, hr,  hrH, hr,  hrH, hr,  hr ], // 4  textured density
      [hr,  hrH, hr,  hrH, skH, sk,  sk,  sk,  sk,  skH, hrH, hr,  hrH, hr ], // 5  forehead peek
      // ── FACE (rows 6-12) — hair tightly frames face ──────────────────────
      [hr,  hr,  hrH, skH, sk,  sk,  sk,  sk,  sk,  sk,  skH, hrH, hr,  hr ], // 6  forehead
      [hr,  hrH, hr,  sk,  brow,brow,sk,  sk,  brow,brow,sk,  hr,  hrH, hr ], // 7  eyebrows
      [hr,  hr,  sk,  sk,  eyW, ey,  sk,  sk,  eyW, ey,  sk,  sk,  hr,  hr ], // 8  eye whites + iris
      [hr,  hrD, sk,  sk,  ey,  eyP, sk,  sk,  ey,  eyP, sk,  sk,  hrD, hr ], // 9  iris + pupil
      [hr,  hrD, sk,  sk,  sk,  sk,  sk,  sk,  sk,  sk,  sk,  sk,  hrD, hr ], // 10 mid face
      [hr,  hr,  hrD, sk,  ck,  sk,  sk,  sk,  sk,  ck,  sk,  hrD, hr,  hr ], // 11 cheeks
      [hrH, hr,  hrD, sk,  sk,  sk,  mt,  mt,  sk,  sk,  sk,  hrD, hr,  hrH], // 12 mouth
      // ── BIG WAVE — hair flows past the shoulders in large S curves ───────
      [hr,  hrH, hrD, hrD, sk,  sk,  sk,  sk,  sk,  sk,  hrD, hrD, hrH, hr ], // 13 chin / neck, hair wraps
      [hrX, hr,  hrH, T,   stH, st,  st,  st,  st,  stH, T,   hrH, hr,  hrX], // 14 WAVE CREST outward
      [hr,  hrH, hr,  hrD, stD, st,  stH, st,  st,  stD, hrD, hr,  hrH, hr ], // 15 hair curls inward
      [hrH, hr,  hrX, T,   stD, st,  st,  st,  st,  stD, T,   hrX, hr,  hrH], // 16 WAVE CREST outward (wider)
      [hr,  hrH, hr,  hrD, stD, st,  st,  st,  st,  stD, hrD, hr,  hrH, hr ], // 17 curls inward again
      [hrH, hr,  hrD, blt, blt, pnD, pn,  pn,  pnD, blt, blt, hrD, hr,  hrH], // 18 belt + wave ends
      [hr,  hrD, T,   T,   pnD, pn,  pn,  pn,  pn,  pnD, T,   T,   hrD, hr ], // 19 last hair tips
      // ── LOWER BODY ───────────────────────────────────────────────────────
      [T,   T,   T,   T,   pnD, pn,  pn,  pn,  pn,  pnD, T,   T,   T,   T  ], // 20 pants
      [T,   T,   T,   T,   pnD, pn,  T,   T,   pn,  pnD, T,   T,   T,   T  ], // 21 legs split
      [T,   T,   T,   T,   bt,  btH, bt,  T,   bt,  btH, bt,  T,   T,   T  ], // 22 boot top
      [T,   T,   T,   T,   bt,  btH, bt,  bt,  bt,  btH, bt,  T,   T,   T  ], // 23 boot sole
    ];
  } else {
    // bjerg — textured thick short hair, swoopy side-swept bang, 4x the volume
    // 14 cols × 24 rows.  Crown is 5 rows of layered strands;
    // bang sweeps diagonally across the forehead, sideburns taper down the jaw.
    return [
      // ── HAIR CROWN (rows 0-4) — thick textured spikes ────────────────────
      [T,   T,   hrH, hr,  hrD, hr,  hrH, hr,  hrD, hr,  hrH, hr,  T,   T  ], // 0  spiky top
      [T,   hrH, hr,  hrH, hr,  hrD, hr,  hrH, hr,  hrD, hr,  hrH, hr,  T  ], // 1  textured layer
      [T,   hr,  hrD, hr,  hrH, hr,  hr,  hrD, hr,  hrH, hr,  hr,  hrD, T  ], // 2  layered strands
      [hr,  hrH, hr,  hrD, hr,  hrH, hr,  hr,  hrH, hr,  hrD, hr,  hrH, hr ], // 3  MAX width + layered
      [hr,  hr,  hrH, hr,  hrD, hr,  hrH, hr,  hr,  hrD, hr,  hrH, hr,  hrD], // 4  side-swept sweep begins
      // ── BANG + FOREHEAD (rows 5-6) — bang drapes diagonally ──────────────
      [T,   hr,  hrH, hrD, hr,  hrH, skH, sk,  sk,  skH, hrH, hrD, hr,  T  ], // 5  bang crosses forehead
      [T,   T,   hr,  hrD, skH, sk,  sk,  sk,  sk,  sk,  skH, hrD, hr,  T  ], // 6  forehead + sideburn frame
      // ── FACE (rows 7-12) ─────────────────────────────────────────────────
      [T,   hr,  hr,  sk,  brow,brow,sk,  sk,  brow,brow,sk,  sk,  hr,  T  ], // 7  eyebrows
      [T,   hr,  sk,  sk,  eyW, ey,  sk,  sk,  eyW, ey,  sk,  sk,  hr,  T  ], // 8  eye whites + iris
      [T,   hr,  sk,  sk,  ey,  eyP, sk,  sk,  ey,  eyP, sk,  sk,  hr,  T  ], // 9  iris + pupil
      [T,   hr,  sk,  sk,  sk,  sk,  sk,  sk,  sk,  sk,  sk,  sk,  hr,  T  ], // 10 mid face
      [T,   hrD, sk,  sk,  ck,  sk,  sk,  sk,  sk,  ck,  sk,  sk,  hrD, T  ], // 11 cheeks + sideburns
      [T,   T,   hrD, sk,  sk,  sk,  mt,  mt,  sk,  sk,  sk,  hrD, T,   T  ], // 12 mouth + sideburn taper
      [T,   T,   T,   hrD, hrD, sk,  sk,  sk,  sk,  hrD, hrD, T,   T,   T  ], // 13 jaw / neck line
      // ── BODY (rows 14-19) ────────────────────────────────────────────────
      [T,   T,   T,   T,   stH, st,  st,  st,  st,  stH, T,   T,   T,   T  ], // 14 collar
      [T,   T,   T,   stD, st,  stH, st,  st,  stH, st,  stD, T,   T,   T  ], // 15 shoulders
      [T,   T,   T,   stD, st,  st,  st,  st,  st,  st,  stD, T,   T,   T  ], // 16 torso
      [T,   T,   T,   stD, st,  st,  st,  st,  st,  st,  stD, T,   T,   T  ], // 17 torso
      [T,   T,   T,   blt, blt, pnD, pn,  pn,  pnD, blt, blt, T,   T,   T  ], // 18 belt
      [T,   T,   T,   T,   pnD, pn,  pn,  pn,  pn,  pnD, T,   T,   T,   T  ], // 19 pants
      // ── LOWER BODY ───────────────────────────────────────────────────────
      [T,   T,   T,   T,   pnD, pn,  pn,  pn,  pn,  pnD, T,   T,   T,   T  ], // 20 pants
      [T,   T,   T,   T,   pnD, pn,  T,   T,   pn,  pnD, T,   T,   T,   T  ], // 21 legs split
      [T,   T,   T,   T,   bt,  btH, bt,  T,   bt,  btH, bt,  T,   T,   T  ], // 22 boot top
      [T,   T,   T,   T,   bt,  btH, bt,  bt,  bt,  btH, bt,  T,   T,   T  ], // 23 boot sole
    ];
  }
}

// pose: 'stand' | 'sit' | 'lie'
function drawCharacterPosed(ctx, player, x, y, scale, frame, pose, isIdle, dir) {
  const grid  = buildSpriteGrid(player);
  const flip  = dir === -1;
  if (flip) {
    ctx.save();
    const cx = x + (SPRITE_W * scale) / 2;
    ctx.translate(cx, 0);
    ctx.scale(-1, 1);
    ctx.translate(-cx, 0);
  }
  if (pose === 'lie') {
    _drawLying(ctx, grid, x, y, scale);
  } else if (pose === 'sit') {
    _drawSitting(ctx, grid, x, y, scale);
  } else if (isIdle) {
    _drawGrid(ctx, grid, x, y, scale);
  } else {
    _drawWalking(ctx, grid, x, y, scale, frame);
  }
  if (flip) ctx.restore();
}

function _drawGrid(ctx, grid, x, y, scale) {
  for (let row = 0; row < grid.length; row++) {
    for (let col = 0; col < grid[row].length; col++) {
      const c = grid[row][col];
      if (c === 'transparent') continue;
      ctx.fillStyle = c;
      ctx.fillRect(Math.floor(x + col * scale), Math.floor(y + row * scale), scale, scale);
    }
  }
}

// Walking gait: alternating lower-leg lift (rows 21-23) with a tiny body bob.
// Left leg spans cols 4-6, right leg cols 7-10 in the sprite grid.
function _drawWalking(ctx, grid, x, y, scale, frame) {
  const phase     = frame * 0.15;
  const leftLift  = Math.max(0, Math.sin(phase))           * scale;
  const rightLift = Math.max(0, Math.sin(phase + Math.PI)) * scale;
  const bodyBob   = -Math.abs(Math.sin(phase)) * scale * 0.25;
  const LEG_TOP_ROW = 21;

  for (let row = 0; row < grid.length; row++) {
    for (let col = 0; col < grid[row].length; col++) {
      const c = grid[row][col];
      if (c === 'transparent') continue;
      ctx.fillStyle = c;
      let yOff = bodyBob;
      if (row >= LEG_TOP_ROW) {
        yOff -= (col <= 6) ? leftLift : rightLift;
      }
      ctx.fillRect(
        Math.floor(x + col * scale),
        Math.floor(y + row * scale + yOff),
        scale, scale
      );
    }
  }
}

function _drawSitting(ctx, grid, x, y, scale) {
  _drawGrid(ctx, grid, x, y, scale);
}

function _drawLying(ctx, grid, x, y, scale) {
  _drawGrid(ctx, grid, x, y, scale);
}

function drawCharacterWithName(ctx, player, x, y, scale, frame, isActive, pose, isIdle, dir) {
  pose   = pose   || 'stand';
  isIdle = isIdle !== false;
  dir    = dir    || 1;

  if (isActive) {
    ctx.save();
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur  = 16;
    ctx.fillStyle   = 'rgba(255,215,0,0.10)';
    ctx.fillRect(x - 4, y - 4, SPRITE_W * scale + 8, SPRITE_H * scale + 8);
    ctx.restore();
  }

  drawCharacterPosed(ctx, player, x, y, scale, frame, pose, isIdle, dir);

  // Name tag
  const tagX = x + (SPRITE_W * scale) / 2;
  const tagY = y - 10;
  ctx.save();
  ctx.font      = `bold ${scale * 2.2}px "Press Start 2P", monospace`;
  ctx.textAlign = 'center';
  const tw  = ctx.measureText(player.displayName).width + 12;
  const th  = scale * 2.8;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  _roundRect(ctx, tagX - tw / 2, tagY - th + 2, tw, th, 4);
  ctx.fill();
  ctx.fillStyle = isActive ? '#FFD700' : '#FFFFFF';
  ctx.fillText(player.displayName, tagX, tagY);
  ctx.restore();
}

function _roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function getSpriteSize(scale) { return { w: SPRITE_W * scale, h: SPRITE_H * scale }; }

</script>
<script>
// Scene rendering — home (with furniture) + work/classroom

const SCALE = 4; // keep in sync with game.js

// ─── Movable home furniture ──────────────────────────────────────────────────

const HOME_FURNITURE_KEYS = ['desk', 'sofa', 'bed'];

const HOME_FURNITURE_META = {
  desk: { yFromFloor: -52, bbox: { dx: 0, dy: -46, w: 110, h: 96 } },
  sofa: { yFromFloor: -58, bbox: { dx: 0, dy:   0, w: 120, h: 64 } },
  bed:  { yFromFloor: -40, bbox: { dx: 0, dy:   0, w: 130, h: 70 } },
};

function _resolveFurnitureXY(key, paneW, H, layout) {
  const lay   = layout || (typeof Data !== 'undefined' ? Data.getHomeLayout() : {});
  const def   = (typeof Data !== 'undefined' ? Data.getDefaultHomeLayout() : { desk: 0.14, sofa: 0.36, bed: 0.58 });
  const xPct  = lay[key] != null ? lay[key] : def[key];
  const x     = Math.round(paneW * xPct);
  const y     = Math.floor(H * 0.6) + HOME_FURNITURE_META[key].yFromFloor;
  return { x, y };
}

function getHomeFurnitureBoxes(paneW, H, layout) {
  const out = [];
  for (const key of HOME_FURNITURE_KEYS) {
    const { x, y } = _resolveFurnitureXY(key, paneW, H, layout);
    const bb       = HOME_FURNITURE_META[key].bbox;
    out.push({
      key,
      x: x + bb.dx, y: y + bb.dy, w: bb.w, h: bb.h,
      anchorX: x, anchorY: y,
    });
  }
  return out;
}

function getFurnitureXBounds(key, paneW) {
  const bb = HOME_FURNITURE_META[key].bbox;
  return { min: -bb.dx, max: paneW - bb.w - bb.dx };
}

function getHomeSnapZones(paneW, H, layout) {
  const floorY  = Math.floor(H * 0.6);
  const spriteH = SPRITE_H * SCALE;
  const dx = _resolveFurnitureXY('desk', paneW, H, layout).x;
  const sx = _resolveFurnitureXY('sofa', paneW, H, layout).x;
  const bx = _resolveFurnitureXY('bed',  paneW, H, layout).x;
  return [
    { id: 'desk',       x: dx + 24, y: floorY - spriteH - 28, pose: 'sit' },
    { id: 'sofa-left',  x: sx + 16, y: floorY - spriteH - 8,  pose: 'sit' },
    { id: 'sofa-right', x: sx + 60, y: floorY - spriteH - 8,  pose: 'sit' },
    { id: 'bed-left',   x: bx + 6,  y: floorY - spriteH + 22, pose: 'lie' },
    { id: 'bed-right',  x: bx + 74, y: floorY - spriteH + 22, pose: 'lie' },
  ];
}

// Characters that are in a classroom sit at these positions (indexed 0,1)
function getClassroomSeatPositions(paneW, H) {
  const floorY  = Math.floor(H * 0.6);
  const spriteH = SPRITE_H * SCALE;
  return [
    { x: paneW * 0.25, y: floorY - spriteH - 6 },
    { x: paneW * 0.60, y: floorY - spriteH - 6 },
  ];
}

function getOfficeSeatPositions(paneW, H) {
  const floorY  = Math.floor(H * 0.6);
  const spriteH = SPRITE_H * SCALE;
  return [
    { x: paneW * 0.18, y: floorY - spriteH - 28 },
    { x: paneW * 0.60, y: floorY - spriteH - 28 },
  ];
}

// ─── Master draw entry ───────────────────────────────────────────────────────

// Draws the full canvas, splitting into panes when the two players are in
// different locations. Returns pane layout so game.js knows where to place chars.
function drawWorldAndGetPanes(ctx, bjergPlayer, hungryPlayer, W, H, highlightFurnitureKey) {
  const bs = bjergPlayer.status  || 'home';
  const hs = hungryPlayer.status || 'home';

  if (bs === hs) {
    // Same scene — full width
    _drawScenePane(ctx, bs, 0, W, H, bjergPlayer.furniture, hungryPlayer.furniture, highlightFurnitureKey);
    _drawSceneLabel(ctx, bs, 0, W);
    return {
      bjerg:  { offX: 0, paneW: W, scene: bs },
      hungry: { offX: 0, paneW: W, scene: hs },
    };
  } else {
    const half = Math.floor(W / 2);
    // Left pane: bjerg's scene
    _drawScenePane(ctx, bs, 0, half, H, bjergPlayer.furniture, hungryPlayer.furniture, highlightFurnitureKey);
    _drawSceneLabel(ctx, bs, 0, half);
    // Divider
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(half - 2, 0, 4, H);
    // Right pane: hungry's scene
    ctx.save();
    ctx.translate(half, 0);
    _drawScenePane(ctx, hs, 0, half, H, bjergPlayer.furniture, hungryPlayer.furniture, highlightFurnitureKey);
    _drawSceneLabel(ctx, hs, 0, half);
    ctx.restore();
    return {
      bjerg:  { offX: 0,    paneW: half, scene: bs },
      hungry: { offX: half, paneW: half, scene: hs },
    };
  }
}

function _drawSceneLabel(ctx, sceneId, offX, paneW) {
  const labels = { home: '🏠 Home', classroom: '📚 School', office: '💼 Work', cafe: '☕ Café' };
  const text   = labels[sceneId] || sceneId;
  ctx.save();
  ctx.font      = '10px "Press Start 2P", monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.textAlign = 'center';
  ctx.fillText(text, offX + paneW / 2, 18);
  ctx.restore();
}

function _drawScenePane(ctx, sceneId, offX, paneW, H, furB, furH, highlightFurnitureKey) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(offX, 0, paneW, H);
  ctx.clip();
  ctx.translate(offX, 0);
  switch (sceneId) {
    case 'home':      _drawHome(ctx, paneW, H, [...(furB||[]), ...(furH||[])], highlightFurnitureKey); break;
    case 'classroom': _drawClassroom(ctx, paneW, H); break;
    case 'office':    _drawOffice(ctx, paneW, H); break;
    case 'cafe':      _drawCafe(ctx, paneW, H); break;
    default:          _drawHome(ctx, paneW, H, []); break;
  }
  ctx.restore();
}

// ─── Helpers ─────────────────────────────────────────────────────────────────

function pxr(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function drawWindow(ctx, x, y, s = 1) {
  const w = 72 * s, h = 60 * s;
  pxr(ctx, x, y, w, h, '#8B6914');
  pxr(ctx, x+4*s, y+4*s, 64*s, 52*s, '#87CEEB');
  pxr(ctx, x+4*s, y+34*s, 64*s, 22*s, '#90EE90');
  pxr(ctx, x+34*s, y+4*s, 4*s, 52*s, '#8B6914');
  pxr(ctx, x+4*s, y+28*s, 64*s, 4*s, '#8B6914');
  ctx.fillStyle = '#FFD700';
  ctx.beginPath(); ctx.arc(x+54*s, y+14*s, 8*s, 0, Math.PI*2); ctx.fill();
}

function drawPlant(ctx, x, y) {
  pxr(ctx, x+8, y+28, 16, 12, '#C0682A');
  pxr(ctx, x+6, y+26, 20, 4,  '#A0561E');
  pxr(ctx, x+15, y+10, 2, 20, '#5D8A3C');
  ctx.fillStyle = '#4CAF50';
  ctx.beginPath(); ctx.ellipse(x+10, y+16, 9, 6, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+22, y+12, 9, 6, 0.5,  0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+16, y+8,  7, 5, 0,    0, Math.PI*2); ctx.fill();
}

// ─── HOME ─────────────────────────────────────────────────────────────────────

function _drawHome(ctx, W, H, allFurniture, highlightFurnitureKey) {
  const floorY = Math.floor(H * 0.6);
  const layout = (typeof Data !== 'undefined') ? Data.getHomeLayout() : null;

  // Sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#B8D4F8'); g.addColorStop(1, '#E8D5F5');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Wall
  pxr(ctx, 0, 0, W, floorY, '#F0E6D3');
  // Subtle wallpaper dots
  ctx.fillStyle = 'rgba(180,140,100,0.12)';
  for (let xi = 20; xi < W; xi += 30)
    for (let yi = 20; yi < floorY; yi += 30) {
      ctx.beginPath(); ctx.arc(xi, yi, 2, 0, Math.PI*2); ctx.fill();
    }

  // Floor
  const fg = ctx.createLinearGradient(0, floorY, 0, H);
  fg.addColorStop(0, '#D4A853'); fg.addColorStop(1, '#B8893A');
  ctx.fillStyle = fg; ctx.fillRect(0, floorY, W, H - floorY);
  ctx.strokeStyle = 'rgba(0,0,0,0.07)'; ctx.lineWidth = 1;
  for (let xi = 0; xi < W; xi += 55) {
    ctx.beginPath(); ctx.moveTo(xi, floorY); ctx.lineTo(xi, H); ctx.stroke();
  }
  pxr(ctx, 0, floorY, W, 5, '#C49A6C'); // baseboard

  // Windows
  drawWindow(ctx, W * 0.05, 30);
  if (W > 300) drawWindow(ctx, W - 110, 30);

  // Wall clock (centre top)
  _drawClock(ctx, W / 2, 50);

  // ── Wardrobe (left wall, fixed) ──
  _drawWardrobe(ctx, W * 0.02, floorY - 110);

  // ── Movable furniture: desk, sofa, bed (positions read from layout) ──
  const desk = _resolveFurnitureXY('desk', W, H, layout);
  const sofa = _resolveFurnitureXY('sofa', W, H, layout);
  const bed  = _resolveFurnitureXY('bed',  W, H, layout);
  _drawFurnitureHighlight(ctx, 'desk', desk.x, desk.y, highlightFurnitureKey);
  _drawComputerDesk(ctx, desk.x, desk.y);
  _drawFurnitureHighlight(ctx, 'sofa', sofa.x, sofa.y, highlightFurnitureKey);
  _drawSofa(ctx, sofa.x, sofa.y);
  _drawFurnitureHighlight(ctx, 'bed', bed.x, bed.y, highlightFurnitureKey);
  _drawBed(ctx, bed.x, bed.y);

  // Optional furniture from shop
  if (allFurniture.includes('plant'))     drawPlant(ctx, W - 60, floorY - 44);
  if (allFurniture.includes('bookshelf')) _drawBookshelf(ctx, W * 0.02, floorY - 100);
}

function _drawFurnitureHighlight(ctx, key, x, y, highlightKey) {
  if (key !== highlightKey) return;
  const bb = HOME_FURNITURE_META[key].bbox;
  ctx.save();
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur  = 18;
  ctx.fillStyle   = 'rgba(255,215,0,0.18)';
  ctx.fillRect(x + bb.dx - 4, y + bb.dy - 4, bb.w + 8, bb.h + 8);
  ctx.restore();
}

function _drawClock(ctx, cx, cy) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI*2);
  ctx.fillStyle = '#F5F5F0'; ctx.fill();
  ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 3; ctx.stroke();
  const now = new Date(), hr = now.getHours() % 12, mn = now.getMinutes();
  ctx.save(); ctx.translate(cx, cy);
  ctx.rotate((hr + mn/60) * Math.PI/6 - Math.PI/2);
  ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(11,0); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.translate(cx, cy);
  ctx.rotate(mn * Math.PI/30 - Math.PI/2);
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(15,0); ctx.stroke(); ctx.restore();
  ctx.restore();
}

function _drawWardrobe(ctx, x, y) {
  const w = 68, h = 110;
  pxr(ctx, x, y, w, h, '#8B6914');
  pxr(ctx, x+4, y+4, w-8, h-8, '#C49A6C');
  // two doors
  pxr(ctx, x+6, y+8, (w-16)/2, h-16, '#A0785A');
  pxr(ctx, x+8+(w-16)/2, y+8, (w-16)/2, h-16, '#A0785A');
  // handles
  pxr(ctx, x+(w/2)-6, y+h/2-3, 4, 6, '#8B6914');
  pxr(ctx, x+(w/2)+2, y+h/2-3, 4, 6, '#8B6914');
  // top trim
  pxr(ctx, x, y, w, 8, '#7B5010');
}

function _drawComputerDesk(ctx, x, y) {
  // Desk body
  pxr(ctx, x, y, 110, 10, '#A0785A');
  pxr(ctx, x, y+2, 110, 4, '#C49A6C');
  pxr(ctx, x+6, y+10, 10, 40, '#8B6914');
  pxr(ctx, x+94, y+10, 10, 40, '#8B6914');
  // Monitor
  pxr(ctx, x+30, y-46, 50, 34, '#1A1A2E');
  pxr(ctx, x+34, y-42, 42, 26, '#00AACC');
  // screen glow lines
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  for (let i = 0; i < 4; i++) ctx.fillRect(x+36, y-40+i*6, 38, 2);
  pxr(ctx, x+52, y-12, 8, 12, '#1A1A2E');
  pxr(ctx, x+42, y-2, 26, 4, '#1A1A2E');
  // Keyboard
  pxr(ctx, x+20, y-4, 60, 6, '#555');
}

function _drawSofa(ctx, x, y) {
  // seat
  pxr(ctx, x, y+22, 120, 36, '#7B68EE');
  pxr(ctx, x+4, y+26, 112, 28, '#9B8FFF');
  // back
  pxr(ctx, x, y, 120, 26, '#7B68EE');
  pxr(ctx, x+4, y+4, 112, 20, '#9B8FFF');
  // armrests
  pxr(ctx, x, y, 16, 58, '#7B68EE');
  pxr(ctx, x+104, y, 16, 58, '#7B68EE');
  // cushions
  pxr(ctx, x+18, y+26, 36, 26, '#8B7BFF');
  pxr(ctx, x+62, y+26, 36, 26, '#8B7BFF');
  // legs
  pxr(ctx, x+4, y+54, 10, 10, '#5D4037');
  pxr(ctx, x+106, y+54, 10, 10, '#5D4037');
}

function _drawBed(ctx, x, y) {
  const w = 130;
  // frame
  pxr(ctx, x, y, w, 70, '#8B6914');
  // mattress
  pxr(ctx, x+4, y+18, w-8, 50, '#F5E6CC');
  // pillow
  pxr(ctx, x+8, y+20, 36, 22, '#FFFFFF');
  pxr(ctx, x+10, y+22, 32, 18, '#F0F0F0');
  // blanket
  pxr(ctx, x+4, y+38, w-8, 26, '#B0C4DE');
  pxr(ctx, x+4, y+38, w-8, 6,  '#90A8C8');
  // headboard
  pxr(ctx, x, y, w, 16, '#7B5010');
  pxr(ctx, x+6, y+3, 10, 10, '#9A6814');
  pxr(ctx, x+w-16, y+3, 10, 10, '#9A6814');
}

function _drawBookshelf(ctx, x, y) {
  pxr(ctx, x, y, 60, 80, '#8B6914');
  const colors = ['#E74C3C','#3498DB','#2ECC71','#F39C12','#9B59B6','#1ABC9C'];
  for (let row = 0; row < 3; row++) {
    const sy = y + 6 + row * 24;
    pxr(ctx, x+4, sy, 52, 18, '#F5F5DC');
    for (let b = 0; b < 6; b++) {
      ctx.fillStyle = colors[(b + row*2) % colors.length];
      ctx.fillRect(x+6+b*8, sy+2, 7, 14);
    }
    pxr(ctx, x+4, sy+18, 52, 3, '#8B6914');
  }
}

// ─── CLASSROOM ────────────────────────────────────────────────────────────────

function _drawClassroom(ctx, W, H) {
  const floorY = Math.floor(H * 0.6);
  pxr(ctx, 0, 0, W, floorY, '#E8D5A3');
  const fg = ctx.createLinearGradient(0, floorY, 0, H);
  fg.addColorStop(0,'#C9A84C'); fg.addColorStop(1,'#A88730');
  ctx.fillStyle = fg; ctx.fillRect(0, floorY, W, H-floorY);
  ctx.strokeStyle = 'rgba(0,0,0,0.07)'; ctx.lineWidth = 1;
  for (let xi = 0; xi < W; xi += 50) { ctx.beginPath(); ctx.moveTo(xi,floorY); ctx.lineTo(xi,H); ctx.stroke(); }
  pxr(ctx, 0, floorY, W, 5, '#B8973C');

  // Blackboard
  const bx = W/2 - 80;
  pxr(ctx, bx, 20, 160, 90, '#4A3728');
  pxr(ctx, bx+6, 26, 148, 78, '#2D6A4F');
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.font = '13px monospace';
  ctx.fillText('y = mx + b', bx+20, 60);
  ctx.fillText('∫ f(x) dx', bx+20, 82);
  pxr(ctx, bx+6, 104, 148, 8, '#5D4037');

  // Teacher desk
  _drawStudentDesk(ctx, W/2 - 55, floorY - 50);

  // Student desks
  const deskY = floorY - 50;
  _drawStudentDesk(ctx, W * 0.15, deskY);
  _drawStudentDesk(ctx, W * 0.55, deskY);
  _drawChair(ctx, W * 0.16 + 5, deskY - 2);
  _drawChair(ctx, W * 0.56 + 5, deskY - 2);
  // Books on student desks
  _drawBook(ctx, W*0.17 + 15, deskY - 8);
  _drawBook(ctx, W*0.57 + 15, deskY - 8);

  drawWindow(ctx, W - 100, 25, 0.85);
}

function _drawStudentDesk(ctx, x, y) {
  pxr(ctx, x, y, 90, 10, '#A0785A');
  pxr(ctx, x, y+2, 90, 4, '#C49A6C');
  pxr(ctx, x+6, y+10, 8, 35, '#8B6914');
  pxr(ctx, x+76, y+10, 8, 35, '#8B6914');
}

function _drawChair(ctx, x, y) {
  pxr(ctx, x, y, 36, 7, '#8B6914');
  pxr(ctx, x+3, y-28, 30, 30, '#8B6914');
  pxr(ctx, x+7, y-24, 22, 22, '#C49A6C');
  pxr(ctx, x+3, y+7, 6, 20, '#8B6914');
  pxr(ctx, x+27, y+7, 6, 20, '#8B6914');
}

function _drawBook(ctx, x, y) {
  pxr(ctx, x, y, 28, 6, '#E74C3C');
  pxr(ctx, x+2, y+1, 24, 4, '#C0392B');
  pxr(ctx, x+12, y, 2, 6, '#922B21');
}

// ─── OFFICE ───────────────────────────────────────────────────────────────────

function _drawOffice(ctx, W, H) {
  const floorY = Math.floor(H * 0.6);
  pxr(ctx, 0, 0, W, floorY, '#D4C5A9');
  const fg = ctx.createLinearGradient(0, floorY, 0, H);
  fg.addColorStop(0,'#8B7355'); fg.addColorStop(1,'#6B5535');
  ctx.fillStyle = fg; ctx.fillRect(0, floorY, W, H-floorY);
  ctx.strokeStyle = 'rgba(0,0,0,0.07)'; ctx.lineWidth = 1;
  for (let xi = 0; xi < W; xi += 50) { ctx.beginPath(); ctx.moveTo(xi,floorY); ctx.lineTo(xi,H); ctx.stroke(); }
  pxr(ctx, 0, floorY, W, 5, '#7A6545');

  drawWindow(ctx, W/2 - 36, 28);
  if (W > 300) { drawWindow(ctx, 20, 28); drawWindow(ctx, W-100, 28); }

  // Two computer desks
  _drawComputerDesk(ctx, W * 0.08, floorY - 52);
  _drawComputerDesk(ctx, W * 0.55, floorY - 52);
  _drawChair(ctx, W*0.09+8, floorY - 54);
  _drawChair(ctx, W*0.56+8, floorY - 54);
  _drawBookshelf(ctx, W/2 - 30, floorY - 100);
  drawPlant(ctx, W - 56, floorY - 44);
}

// ─── CAFÉ ─────────────────────────────────────────────────────────────────────

function _drawCafe(ctx, W, H) {
  const floorY = Math.floor(H * 0.6);
  pxr(ctx, 0, 0, W, floorY, '#F5DEB3');
  const fg = ctx.createLinearGradient(0, floorY, 0, H);
  fg.addColorStop(0,'#C4956A'); fg.addColorStop(1,'#A0784A');
  ctx.fillStyle = fg; ctx.fillRect(0, floorY, W, H-floorY);
  ctx.strokeStyle = 'rgba(0,0,0,0.07)'; ctx.lineWidth = 1;
  for (let xi = 0; xi < W; xi += 40) { ctx.beginPath(); ctx.moveTo(xi,floorY); ctx.lineTo(xi,H); ctx.stroke(); }
  pxr(ctx, 0, floorY, W, 5, '#B8853A');
  _drawCafeTable(ctx, W/2-45, floorY-40);
  _drawChair(ctx, W/2-38, floorY-44);
  _drawChair(ctx, W/2+16, floorY-44);
  drawPlant(ctx, W-60, floorY-44);
  drawPlant(ctx, 10, floorY-44);
  drawWindow(ctx, W/2-36, 28);
}

function _drawCafeTable(ctx, x, y) {
  pxr(ctx, x, y, 90, 10, '#C49A6C');
  pxr(ctx, x+2, y+2, 86, 4, '#D4AA7D');
  pxr(ctx, x+8, y+10, 8, 30, '#A0785A');
  pxr(ctx, x+74, y+10, 8, 30, '#A0785A');
}

// ─── Public API ──────────────────────────────────────────────────────────────

function getSceneList() {
  return {
    home:      { label: 'Home',       emoji: '🏠' },
    classroom: { label: 'Classroom',  emoji: '📚' },
    office:    { label: 'Work',       emoji: '💼' },
    cafe:      { label: 'Café',       emoji: '☕' },
  };
}

</script>
<script>
// UI panel management

let currentPanel = 'goals';
let activePlayer = 'bjerg';
let showAddGoal = false;
let showAddTodo = false;
let showAddReward = false;
let notification = null;
let notifTimer = null;

function setActivePlayer(id) { activePlayer = id; renderUI(); }
function getActivePlayer() {
  // If logged in, always return logged-in player as active
  const loggedIn = typeof Auth !== 'undefined' ? Auth.getLoggedIn() : null;
  return loggedIn || activePlayer;
}

// ─── Login Screen ─────────────────────────────────────────────────────────────

function showLoginScreen() {
  document.getElementById('login-overlay').style.display = 'flex';
}
function hideLoginScreen() {
  document.getElementById('login-overlay').style.display = 'none';
}

function renderLoginScreen() {
  const container = document.getElementById('login-cards');

  // Authenticated via Supabase but player not chosen yet → show character picker
  if (Auth._isAuthenticated && !Auth._playerId) {
    const data = Data.load();
    container.innerHTML = ['bjerg', 'hungry'].map(id => {
      const p = data.players[id];
      return `<div class="login-card" onclick="selectLoginPlayer('${id}')">
        <div class="login-avatar" style="background:${p.skin};border-color:${p.hairColor}">
          <div class="login-hair" style="background:${p.hairColor};height:${p.hairStyle==='long'?'60%':'40%'}"></div>
          <div class="login-eyes">
            <div style="background:${p.eyeColor}"></div>
            <div style="background:${p.eyeColor}"></div>
          </div>
        </div>
        <div class="login-name">${p.displayName}</div>
        <div class="login-coins">🪙 ${p.coins}</div>
      </div>`;
    }).join('');
    return;
  }

  // Not authenticated → show email + password form
  container.innerHTML = `
    <div class="login-email-form">
      <input type="email" id="login-email" class="input-full" placeholder="Email address"
             onkeydown="if(event.key==='Enter')document.getElementById('login-password').focus()">
      <input type="password" id="login-password" class="input-full" placeholder="Password"
             style="margin-top:8px"
             onkeydown="if(event.key==='Enter')submitEmailLogin()">
      <div id="login-error" style="color:#E74C3C;font-size:8px;min-height:16px;margin-top:6px;text-align:center"></div>
      <div class="form-actions" style="margin-top:8px;justify-content:center">
        <button class="btn-primary" onclick="submitEmailLogin()">Sign In ▶</button>
      </div>
    </div>`;
}

async function selectLoginPlayer(id) {
  try {
    await Auth.setPlayer(id);
    _finishLogin(id);
  } catch (e) {
    showNotification('Error: ' + e.message, 'warn');
  }
}

async function submitEmailLogin() {
  const email    = document.getElementById('login-email')?.value.trim();
  const password = document.getElementById('login-password')?.value;
  const errEl    = document.getElementById('login-error');
  if (!email || !password) { if (errEl) errEl.textContent = 'Enter email and password'; return; }
  if (errEl) errEl.textContent = 'Signing in…';
  try {
    const result = await Auth.signIn(email, password);
    if (result.needsPlayerChoice) {
      renderLoginScreen(); // show character picker
    } else {
      _finishLogin(Auth.getLoggedIn());
    }
  } catch (e) {
    if (errEl) errEl.textContent = e.message;
  }
}

async function _finishLogin(id) {
  activePlayer = id;
  // Now that we're authenticated, reload data from Supabase + subscribe to realtime
  await Data.loadRemote();
  Data.setupRealtime();
  updateSyncStatus();
  hideLoginScreen();
  renderUI();
  document.getElementById('logout-btn').style.display = 'inline-flex';
  document.getElementById('logout-btn').querySelector('.logout-name').textContent = id;
}

function doLogout() {
  Auth.signOut();
}

function updateSyncStatus() {
  const syncEl = document.getElementById('sync-status');
  if (!syncEl) return;
  const base = 'position:absolute;top:12px;right:12px;font-family:"Press Start 2P",monospace;font-size:7px;padding:4px 8px;border-radius:6px;z-index:10;';
  if (window._supabaseOK) {
    syncEl.textContent = '☁️ synced';
    syncEl.title = '';
    syncEl.style.cssText = base + 'pointer-events:none;color:#4CAF50;background:rgba(76,175,80,0.15);border:1px solid rgba(76,175,80,0.3)';
  } else {
    const errMsg = window._supabaseError || (Auth._isAuthenticated ? 'Unknown Supabase error' : 'Not signed in');
    syncEl.textContent = '💾 offline';
    syncEl.title = errMsg;
    syncEl.style.cssText = base + 'pointer-events:auto;cursor:help;color:#E74C3C;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3)';
    console.error('[Supabase]', errMsg);
  }
}

function showNotification(msg, type = 'coins') {
  clearTimeout(notifTimer);
  notification = { msg, type };
  const el = document.getElementById('notification');
  el.textContent = msg;
  el.className = `notification show ${type}`;
  notifTimer = setTimeout(() => {
    el.classList.remove('show');
    notification = null;
  }, 3000);
}

function renderUI() {
  renderPlayerTabs();
  renderPanel();
  renderCoinDisplay();
}

function renderPlayerTabs() {
  const data     = Data.load();
  const bjerg    = data.players.bjerg;
  const hungry   = data.players.hungry;
  const loggedIn = typeof Auth !== 'undefined' ? Auth.getLoggedIn() : null;
  const cur      = getActivePlayer();

  // When logged in, only show own tab (other is read-only, shown as info)
  const canSwitch = !loggedIn;

  document.getElementById('tab-bjerg').innerHTML = `
    <div class="player-tab ${cur === 'bjerg' ? 'active' : ''} ${loggedIn && loggedIn !== 'bjerg' ? 'readonly' : ''}"
         onclick="${canSwitch ? "setActivePlayer('bjerg')" : ''}">
      <div class="tab-avatar" style="background:${bjerg.skin};border-color:${bjerg.hairColor}"></div>
      <span>bjerg</span>
      <span class="tab-coins">🪙 ${bjerg.coins}</span>
    </div>`;

    html += `
      <div class="goal-card ${completed ? 'completed' : ''}">
        <div class="goal-header">
          <span class="goal-title">${goal.isPrivate ? '🔒 ' : ''}${escHtml(goal.title)}</span>
