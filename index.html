<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Little World 🌟</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>

<!-- ─── LOADING OVERLAY ─────────────────────────────────────── -->
<div id="loading-overlay" style="
  position:fixed;inset:0;background:#1a1a2e;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:99999;font-family:'Press Start 2P',monospace;">
  <div style="color:#FFD700;font-size:11px;margin-bottom:18px">Our Little World ♥</div>
  <div style="color:#888;font-size:8px">Connecting...</div>
</div>

<!-- ─── LOGIN OVERLAY ──────────────────────────────────────── -->
<div id="login-overlay" style="display:none">
  <div class="login-box">
    <div class="login-title">Our Little World <span>♥</span></div>
    <div class="login-subtitle">Sign in to play</div>
    <div id="login-cards"></div>
  </div>
</div>

<div id="app">

  <!-- ─── HEADER ─────────────────────────────────────────── -->
  <header>
    <div class="logo">Our Little World <span>♥</span></div>
    <div class="player-tabs">
      <div id="tab-bjerg"></div>
      <div id="tab-hungry"></div>
    </div>
    <button id="logout-btn" onclick="doLogout()" style="display:none">
      <span class="logout-name"></span> · Log out
    </button>
  </header>

  <!-- ─── MAIN LAYOUT ────────────────────────────────────── -->
  <div id="main-layout">

    <!-- Game Canvas -->
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
      <div class="game-hint">Drag your character to furniture · Click floor to walk ✨</div>
      <div id="coin-display">🪙 <span id="coin-count">0</span></div>
      <div id="sync-status" style="position:absolute;top:12px;right:12px;font-family:'Press Start 2P',monospace;font-size:7px;padding:4px 8px;border-radius:6px;pointer-events:none;z-index:10"></div>
    </div>

    <!-- Side Panel -->
    <div id="side-panel">
      <nav class="panel-nav">
        <button class="panel-tab active" data-panel="goals"  onclick="switchPanel('goals')">🎯 Goals</button>
        <button class="panel-tab"        data-panel="todos"  onclick="switchPanel('todos')">📝 To-Do</button>
        <button class="panel-tab"        data-panel="shop"   onclick="switchPanel('shop')">🛍 Shop</button>
        <button class="panel-tab"        data-panel="status" onclick="switchPanel('status')">📍 Status</button>
      </nav>
      <div id="panel-content"></div>
    </div>

  </div>
</div>

<div id="notification"></div>
<canvas id="confetti-canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/scenes.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script>
window.addEventListener('DOMContentLoaded', async () => {
  // Load data from Supabase (falls back to localStorage if offline)
  await Data.loadRemote();

  // Ensure defaults for saves missing new fields
  ['bjerg', 'hungry'].forEach(id => {
    const p = Data.getPlayer(id);
    if (!p.ownedOutfits) Data.updatePlayer(id, { ownedOutfits: ['default'] });
    if (!p.outfit)       Data.updatePlayer(id, { outfit: 'default' });
    if (!p.status)       Data.updatePlayer(id, { status: 'home' });
  });

  // Seed demo data on first load
  const bjerg = Data.getPlayer('bjerg');
  if (bjerg.goals.length === 0) {
    Data.addGoal('bjerg', { title: 'Reach 93 kg', current: 97, target: 93, unit: 'kg', isPrivate: false });
    Data.addTodo('bjerg', 'Go to the gym', false);
    Data.addTodo('bjerg', 'Drink 2L water today', false);
    Data.addCustomReward('bjerg', { name: 'Go eat sushi 🍣', price: 800, emoji: '🍣' });
  }
  const hungry = Data.getPlayer('hungry');
  if (hungry.goals.length === 0) {
    Data.addGoal('hungry', { title: 'Read 12 books this year', current: 3, target: 12, unit: 'books', isPrivate: false });
    Data.addTodo('hungry', 'Study for exam', false);
    Data.addCustomReward('hungry', { name: 'Movie night date 🎬', price: 500, emoji: '🎬' });
  }

  // ─── Real-time sync via Supabase ──────────────────────────
  try {
    _db.channel('game')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'game_state' }, payload => {
        const changedId = payload.new?.id;
        const loggedIn  = Auth.getLoggedIn();
        // Only apply the OTHER player's updates — don't clobber local changes
        if (changedId && changedId !== loggedIn &&
            payload.new?.data && Data._cache?.players?.[changedId]) {
          Data._cache.players[changedId] = { ...Data._cache.players[changedId], ...payload.new.data };
          localStorage.setItem('coupleGame', JSON.stringify(Data._cache));
          renderUI();
        }
      })
      .subscribe();
  } catch (e) {
    console.warn('Realtime subscription failed:', e.message);
  }

  // ─── Show login or go straight in ─────────────────────────
  const loggedIn = Auth.getLoggedIn();
  if (loggedIn) {
    activePlayer = loggedIn;
    document.getElementById('logout-btn').style.display = 'inline-flex';
    document.getElementById('logout-btn').querySelector('.logout-name').textContent = loggedIn;
  } else {
    renderLoginScreen();
    document.getElementById('login-overlay').style.display = 'flex';
  }

  renderUI();
  initGame();
  setupCanvasClick();

  // Show cloud sync status
  const syncEl = document.getElementById('sync-status');
  if (syncEl) {
    if (window._supabaseOK) {
      syncEl.textContent = '☁️ synced';
      syncEl.style.cssText += 'color:#4CAF50;background:rgba(76,175,80,0.15);border:1px solid rgba(76,175,80,0.3)';
    } else {
      const errMsg = window._supabaseError || '';
      syncEl.textContent = '💾 offline';
      syncEl.title = errMsg; // hover to see error
      syncEl.style.cssText += 'color:#E74C3C;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);cursor:help';
      if (errMsg) console.error('[Supabase] Last error:', errMsg);
    }
  }

  // Hide loading overlay once everything is ready
  document.getElementById('loading-overlay').style.display = 'none';
});
</script>

</body>
</html>
